name: release run

# The full synthetic release run on every push: synthetic book, SQL kit, controls gate, studies,
# assumption gate, NPV engine and pricing solve, in-force forecast, Excel rebuild and tie-out to the
# cent, backtest, drift monitoring, local Databricks job, 113 tests. Fails on the first failing step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: LibreOffice (headless Calc for the workbook recalculation)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-calc

      - name: Python packages
        run: python -m pip install -r requirements.txt

      - name: Release run
        run: python run_all.py

      - name: Production mode, end to end
        run: python tests/e2e_production_run.py

      - name: Keep the workbook and headline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-outputs
          path: |
            output/Humana_NPV_Forecasting_Model.xlsx
            output/results.json
            output/run_manifest.json
            output/npv/npv_summary.csv
            output/npv/npv_pricing_solve.csv
          if-no-files-found: warn
